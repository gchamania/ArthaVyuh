[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arthavyuh"
version = "0.1.0"
description = "Local-first deterministic swing trading cockpit core."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ArthaVyuh contributors" }]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pydantic>=2.7",
  "typer[all]>=0.12",
  "rich>=13.7",
  "PyYAML>=6.0",
  "backtrader>=1.9.78.123",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
arthavyuh = "arthavyuh.cli.main:app"

[tool.setuptools.packages.find]
include = ["arthavyuh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
